[project]
name = "erpnext_addons"
authors = [
    { name = "Muhammad Yusuf Tri Daryanto", email = "114971841+Muhayustrid@users.noreply.github.com"}
]
description = "General ERPNext enhancements for Roti Ropi: order Update Items pricing and naming series"
requires-python = ">=3.14"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.dev-dependencies]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
erpnext = ">=16.0.0,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py314"
